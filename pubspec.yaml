name: ringo_app
description: "Ringo App - Aplicación de transporte y envíos en motocicleta."
publish_to: 'none' # Previene la publicación accidental en pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Iconos estilo Cupertino para iOS
  cupertino_icons: ^1.0.6

  # Mapa de Google y coordenadas de la ruta
  google_maps_flutter: ^2.12.3
  google_maps_flutter_android: ^2.21.0
  google_maps_flutter_platform_interface: ^2.17.0
  latlong2: ^0.9.1
  geolocator: ^13.0.4

  # Conexión con Firebase (Auth + Firestore + push)
  firebase_core: ^3.1.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.2.10

  # Peticiones HTTP a Render
  http: ^1.2.1

  url_launcher: ^6.3.1

  # Notificaciones locales (sin servidor) y efectos de sonido
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0

  # Credenciales cifradas y entrada con huella / Face ID
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  device_info_plus: ^12.4.0
  android_id: ^0.6.0
  google_sign_in: 6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.jpg
  min_sdk_android: 23
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/app_icon.jpg
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  # Declaración de la carpeta de assets
  assets:
    - assets/
    - assets/sounds/
    - assets/services/